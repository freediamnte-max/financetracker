<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #EAEFE9; font-family: 'IBM Plex Sans', sans-serif; color: #1B2B22; }
  .ff-display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.01em; }
  input:focus { border-color: #3E5C76 !important; outline: none; }
  button { cursor: pointer; border: none; font-family: inherit; }
  .btn-ios {
    border-radius: 16px;
    font-weight: 600;
    transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.25);
    background-image: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 50%);
  }
  .btn-ios:active { transform: scale(0.965); opacity: 0.9; box-shadow: 0 1px 4px rgba(0,0,0,0.10); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const META = {
  needs:   { label: 'Необходимое', hint: 'На жизнь',   color: '#4361EE', soft: '#E8EDFC' },
  wants:   { label: 'Желания',     hint: 'Для себя',   color: '#FF6B4A', soft: '#FFEBE3' },
  savings: { label: 'Накопления',  hint: 'На будущее', color: '#F2A93F', soft: '#FCF0DC' },
};
const CATS = ['needs', 'wants', 'savings'];
const CURRENCIES = [
  { code: 'RUB', label: '₽ Рубль' },
  { code: 'USD', label: '$ Доллар' },
  { code: 'EUR', label: '€ Евро' },
  { code: 'UAH', label: '₴ Гривна' },
];
// All amounts are stored internally in RUB. FX_STATE lets fmt() render them
// in whichever currency the user picked, using the latest fetched rate — without
// touching any stored numbers.
const FX_STATE = { currency: 'RUB', rates: null };
function fmt(amountRub) {
  const cur = FX_STATE.currency || 'RUB';
  const rate = cur === 'RUB' ? 1 : (FX_STATE.rates && FX_STATE.rates[cur]);
  const converted = rate ? amountRub * rate : amountRub;
  const effectiveCur = rate ? cur : 'RUB';
  try {
    return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: effectiveCur, maximumFractionDigits: effectiveCur === 'RUB' ? 0 : 2 }).format(converted || 0);
  } catch (e) {
    return new Intl.NumberFormat('ru-RU').format(Math.round(converted || 0)) + ' ' + effectiveCur;
  }
}
const uid = () => Math.random().toString(36).slice(2, 9);
const monthKey = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth(); };

const DEFAULT_DATA = {
  percents: { needs: 50, wants: 30, savings: 20 },
  balances: { needs: 0, wants: 0, savings: 0 },
  goals: { wants: [], savings: [] },
  subcats: { needs: ['Еда', 'Транспорт', 'Интернет'], wants: ['Развлечения'] },
  incomeLog: [],
  expenseLog: [],
  displayCurrency: 'RUB',
  incomeSources: [],
};

// --- Storage: Telegram CloudStorage when running inside Telegram, localStorage otherwise ---
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const storage = {
  get(key) {
    return new Promise((resolve) => {
      if (tg && tg.CloudStorage) {
        tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
      } else {
        resolve(window.localStorage.getItem(key));
      }
    });
  },
  set(key, value) {
    return new Promise((resolve) => {
      if (tg && tg.CloudStorage) {
        tg.CloudStorage.setItem(key, value, (err, ok) => resolve(!err));
      } else {
        window.localStorage.setItem(key, value);
        resolve(true);
      }
    });
  },
};

function Donut({ segments, size = 176, stroke = 18 }) {
  const pad = 22;
  const vb = size + pad * 2;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const gap = segments.length > 1 ? 7 : 0;
  const cx = vb / 2, cy = vb / 2;
  let offset = 0;
  return (
    <svg width={vb} height={vb} viewBox={`0 0 ${vb} ${vb}`} style={{ overflow: 'visible' }}>
      <defs>
        <filter id="ringGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        {segments.map((s, i) => (
          <linearGradient id={`ringGrad-${i}`} key={i} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={s.color} stopOpacity="0.55" />
            <stop offset="100%" stopColor={s.color} stopOpacity="1" />
          </linearGradient>
        ))}
      </defs>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#E7E4D8" strokeWidth={stroke} />
      {segments.map((s, i) => {
        const frac = s.value / total;
        const rawLen = frac * c;
        const dash = Math.max(rawLen - gap, 0);
        const el = (
          <circle
            key={i} cx={cx} cy={cy} r={r} fill="none"
            stroke={`url(#ringGrad-${i})`} strokeWidth={stroke}
            strokeDasharray={`${dash} ${c - dash}`} strokeDashoffset={-offset - gap / 2}
            strokeLinecap="round" filter="url(#ringGlow)"
            style={{ transition: 'stroke-dasharray 0.7s cubic-bezier(.4,0,.2,1), stroke-dashoffset 0.7s cubic-bezier(.4,0,.2,1)' }}
            transform={`rotate(-90 ${cx} ${cy})`}
          />
        );
        offset += rawLen;
        return el;
      })}
    </svg>
  );
}

function Bar({ label, value, max, color }) {
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 4 }}>
        <span>{label}</span><span style={{ color: '#6B7268' }}>{fmt(value)}</span>
      </div>
      <div style={{ width: '100%', background: '#E7E4D8', borderRadius: 999, height: 8 }}>
        <div style={{ width: pct + '%', background: color, height: 8, borderRadius: 999 }} />
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: 'block', marginBottom: 16 }}>
      <span style={{ display: 'block', fontSize: 12, fontWeight: 500, marginBottom: 6, color: '#6B7268' }}>{label}</span>
      {children}
    </label>
  );
}

const inputStyle = { width: '100%', borderRadius: 12, padding: '12px 14px', fontSize: 16, border: '1px solid #DDD8C8', background: '#fff' };

// --- Custom line icons (replace emoji) ---
const iconProps = { width: 20, height: 20, viewBox: '0 0 20 20', fill: 'none', stroke: 'currentColor', strokeWidth: 1.6, strokeLinecap: 'round', strokeLinejoin: 'round' };
function IconSettings(props) {
  return <svg {...iconProps} {...props}><circle cx="10" cy="10" r="7" strokeWidth="3" strokeDasharray="2.75 2.75" /><circle cx="10" cy="10" r="2.2" /></svg>;
}
function IconHome(props) {
  return <svg {...iconProps} {...props}><path d="M3 9.5L10 3l7 6.5" /><path d="M5 8.5V17h10V8.5" /><path d="M8 17v-5h4v5" /></svg>;
}
function IconIncome(props) {
  return <svg {...iconProps} {...props}><path d="M4 12l4-4.5L11 11l5-6" /><path d="M12 5h4v4" /></svg>;
}
function IconExpense(props) {
  return <svg {...iconProps} {...props}><path d="M4 8l4 4.5L11 9l5 6" /><path d="M12 15h4v-4" /></svg>;
}
function IconGoal(props) {
  return <svg {...iconProps} {...props}><circle cx="10" cy="10" r="7" /><circle cx="10" cy="10" r="3.4" /><circle cx="10" cy="10" r="0.6" fill="currentColor" /></svg>;
}
function IconAnalytics(props) {
  return <svg {...iconProps} {...props}><path d="M4 16V9M10 16V4M16 16v-6.5" /></svg>;
}
function IconTrash(props) {
  return <svg {...iconProps} {...props} width={16} height={16}><path d="M4 6h12" /><path d="M8 6V4.5h4V6" /><path d="M5.5 6l.6 9.5h7.8l.6-9.5" /></svg>;
}
function IconPlus(props) {
  return <svg {...iconProps} {...props} width={16} height={16}><path d="M8 3v10M3 8h10" /></svg>;
}
function IconBack(props) {
  return <svg {...iconProps} {...props}><path d="M12.5 4L6 10l6.5 6" /></svg>;
}
function IconClose(props) {
  return <svg {...iconProps} {...props} width={18} height={18}><path d="M5 5l10 10M15 5L5 15" /></svg>;
}
function IconCheck(props) {
  return <svg {...iconProps} {...props}><path d="M4 10.5l4 4L16 6" /></svg>;
}

function GoalBar({ goal, color }) {
  const pct = goal.target > 0 ? Math.min(100, (goal.current / goal.target) * 100) : 0;
  return (
    <div style={{ width: '100%' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, marginBottom: 4 }}>
        <span style={{ fontWeight: 500 }}>{goal.name}</span>
        <span style={{ color: '#6B7268' }}>{fmt(goal.current)}{goal.target > 0 ? ` / ${fmt(goal.target)}` : ''}</span>
      </div>
      <div style={{ width: '100%', borderRadius: 999, height: 8, background: '#E7E4D8' }}>
        <div style={{ width: pct + '%', height: 8, borderRadius: 999, background: color }} />
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(DEFAULT_DATA);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState('dashboard');
  const [pending, setPending] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [goalModal, setGoalModal] = useState(null);

  const [incomeAmount, setIncomeAmount] = useState('');
  const [incomeSource, setIncomeSource] = useState('');
  const [incomeCurrency, setIncomeCurrency] = useState('RUB');
  const [expCategory, setExpCategory] = useState('needs');
  const [expSubcat, setExpSubcat] = useState('');
  const [expAmount, setExpAmount] = useState('');
  const [rates, setRates] = useState(null);
  const [ratesError, setRatesError] = useState(false);

  useEffect(() => {
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) { /* вне Telegram эти методы могут быть недоступны */ } }
    (async () => {
      try {
        const raw = await storage.get('finance-data');
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            // Мягко объединяем со значениями по умолчанию — если в старых сохранённых
            // данных не хватает какого-то нового поля, приложение не падает, а просто
            // подставляет дефолт для него.
            setData({
              ...DEFAULT_DATA, ...parsed,
              percents: { ...DEFAULT_DATA.percents, ...(parsed.percents || {}) },
              balances: { ...DEFAULT_DATA.balances, ...(parsed.balances || {}) },
              goals: {
                wants: (parsed.goals && parsed.goals.wants) || [],
                savings: (parsed.goals && parsed.goals.savings) || [],
              },
              subcats: { ...DEFAULT_DATA.subcats, ...(parsed.subcats || {}) },
              incomeLog: parsed.incomeLog || [],
              expenseLog: parsed.expenseLog || [],
              incomeSources: parsed.incomeSources || [],
            });
          } catch (e) { /* повреждённые сохранённые данные — остаёмся на значениях по умолчанию */ }
        }
      } catch (e) {
        console.error('Ошибка загрузки данных:', e);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    storage.set('finance-data', JSON.stringify(data));
  }, [data, loaded]);

  // Load cached exchange rates, refresh from a public API if stale (>12h)
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        const cachedRaw = await storage.get('fx-rates');
        let cached = null;
        if (cachedRaw) { try { cached = JSON.parse(cachedRaw); } catch (e) {} }
        if (cached && cached.rates) setRates(cached.rates);
        const stale = !cached || (Date.now() - cached.fetchedAt) > 12 * 60 * 60 * 1000;
        if (stale) {
          const res = await fetch('https://open.er-api.com/v6/latest/RUB');
          const json = await res.json();
          if (json && json.rates) {
            setRates(json.rates);
            await storage.set('fx-rates', JSON.stringify({ rates: json.rates, fetchedAt: Date.now() }));
            setRatesError(false);
          }
        }
      } catch (e) {
        console.error('Курс валют недоступен:', e);
        setRatesError(true);
      }
    })();
  }, [loaded]);

  // Keep the shared FX_STATE in sync — done synchronously during render (not in an effect)
  // so that fmt() calls later in this very render already use the current currency/rates.
  FX_STATE.currency = data.displayCurrency || 'RUB';
  FX_STATE.rates = rates;

  const totalBalance = data.balances.needs + data.balances.wants + data.balances.savings;

  function startAllocation() {
    const entered = parseFloat(incomeAmount);
    if (!entered || entered <= 0) return;
    // Entered amount may be in a foreign currency — convert to RUB (the storage currency) once, at entry.
    let amt = entered;
    if (incomeCurrency !== 'RUB') {
      if (rates && rates[incomeCurrency]) {
        amt = entered / rates[incomeCurrency];
      } else {
        return; // курс ещё не загрузился — не даём внести без конвертации
      }
    }
    // Проценты — только стартовая подсказка, дальше сумму можно распределить вручную как угодно.
    const needsAmt = Math.round(amt * data.percents.needs) / 100;
    const wantsAmt = Math.round(amt * data.percents.wants) / 100;
    const savingsAmt = Math.round((amt - needsAmt - wantsAmt) * 100) / 100;
    setPending({ amount: amt, source: incomeSource.trim() || 'Доход', needsAmt, wantsAmt, savingsAmt, wantsAlloc: {}, savingsAlloc: {} });
    setIncomeAmount(''); setIncomeSource('');
  }

  function confirmAllocation() {
    if (!pending) return;
    const needsAmt = parseFloat(pending.needsAmt) || 0;
    const wantsAmt = parseFloat(pending.wantsAmt) || 0;
    const savingsAmt = parseFloat(pending.savingsAmt) || 0;
    if (Math.abs(needsAmt + wantsAmt + savingsAmt - pending.amount) > 0.01) return;
    const wantsAllocated = Object.values(pending.wantsAlloc).reduce((s, v) => s + (parseFloat(v) || 0), 0);
    const savingsAllocated = Object.values(pending.savingsAlloc).reduce((s, v) => s + (parseFloat(v) || 0), 0);
    if (wantsAllocated > wantsAmt + 0.01 || savingsAllocated > savingsAmt + 0.01) return;
    const newGoals = {
      wants: data.goals.wants.map(g => ({ ...g, current: g.current + (parseFloat(pending.wantsAlloc[g.id]) || 0) })),
      savings: data.goals.savings.map(g => ({ ...g, current: g.current + (parseFloat(pending.savingsAlloc[g.id]) || 0) })),
    };
    setData(d => {
      const existingSources = d.incomeSources || [];
      const incomeSources = existingSources.includes(pending.source) ? existingSources : [...existingSources, pending.source];
      return {
        ...d,
        balances: {
          needs: d.balances.needs + needsAmt,
          wants: d.balances.wants + (wantsAmt - wantsAllocated),
          savings: d.balances.savings + (savingsAmt - savingsAllocated),
        },
        goals: newGoals,
        incomeLog: [...d.incomeLog, { id: uid(), amount: pending.amount, source: pending.source, date: Date.now(),
          needsAmt, wantsAmt, savingsAmt,
          wantsAlloc: { ...pending.wantsAlloc }, savingsAlloc: { ...pending.savingsAlloc } }],
        incomeSources,
      };
    });
    setPending(null); setTab('dashboard');
  }

  function deleteIncome(entry) {
    setData(d => {
      const wantsAllocated = Object.values(entry.wantsAlloc || {}).reduce((s, v) => s + (parseFloat(v) || 0), 0);
      const savingsAllocated = Object.values(entry.savingsAlloc || {}).reduce((s, v) => s + (parseFloat(v) || 0), 0);
      const goals = {
        wants: d.goals.wants.map(g => entry.wantsAlloc && entry.wantsAlloc[g.id] ? { ...g, current: g.current - (parseFloat(entry.wantsAlloc[g.id]) || 0) } : g),
        savings: d.goals.savings.map(g => entry.savingsAlloc && entry.savingsAlloc[g.id] ? { ...g, current: g.current - (parseFloat(entry.savingsAlloc[g.id]) || 0) } : g),
      };
      return {
        ...d,
        balances: {
          needs: d.balances.needs - entry.needsAmt,
          wants: d.balances.wants - (entry.wantsAmt - wantsAllocated),
          savings: d.balances.savings - (entry.savingsAmt - savingsAllocated),
        },
        goals,
        incomeLog: d.incomeLog.filter(x => x.id !== entry.id),
      };
    });
  }

  function deleteExpense(entry) {
    setData(d => ({ ...d, balances: { ...d.balances, [entry.category]: d.balances[entry.category] + entry.amount },
      expenseLog: d.expenseLog.filter(x => x.id !== entry.id) }));
  }

  function addExpense() {
    const amt = parseFloat(expAmount);
    const subcat = expSubcat.trim();
    if (!amt || amt <= 0 || !subcat) return;
    setData(d => {
      const subcats = { ...d.subcats };
      if (expCategory !== 'savings') {
        const list = subcats[expCategory] || [];
        if (!list.includes(subcat)) subcats[expCategory] = [...list, subcat];
      }
      const thisMonth = monthKey(Date.now());
      const existingIdx = d.expenseLog.findIndex(x => x.category === expCategory && x.subcat === subcat && monthKey(x.date) === thisMonth);
      let expenseLog;
      if (existingIdx >= 0) {
        expenseLog = d.expenseLog.map((x, i) => i === existingIdx ? { ...x, amount: x.amount + amt, date: Date.now() } : x);
      } else {
        expenseLog = [...d.expenseLog, { id: uid(), category: expCategory, subcat, amount: amt, date: Date.now() }];
      }
      return { ...d, balances: { ...d.balances, [expCategory]: d.balances[expCategory] - amt }, expenseLog, subcats };
    });
    setExpAmount(''); setExpSubcat('');
  }

  function addGoal(category, name, target) {
    if (!name.trim()) return;
    setData(d => ({ ...d, goals: { ...d.goals, [category]: [...d.goals[category], { id: uid(), name: name.trim(), target: parseFloat(target) || 0, current: 0 }] } }));
    setGoalModal(null);
  }
  function deleteGoal(category, id) {
    setData(d => ({ ...d, goals: { ...d.goals, [category]: d.goals[category].filter(g => g.id !== id) } }));
  }
  function savePercents(p) {
    if (p.needs + p.wants + p.savings !== 100) return false;
    setData(d => ({ ...d, percents: p })); return true;
  }
  function resetAll() { setData(DEFAULT_DATA); }

  const analytics = useMemo(() => {
    const totalIncome = data.incomeLog.reduce((s, x) => s + x.amount, 0);
    const totalExpense = data.expenseLog.reduce((s, x) => s + x.amount, 0);
    const byCategory = CATS.map(c => ({ name: META[c].label, color: META[c].color,
      value: data.expenseLog.filter(x => x.category === c).reduce((s, x) => s + x.amount, 0) })).filter(x => x.value > 0);
    const bySubcatMap = {};
    data.expenseLog.forEach(x => { bySubcatMap[x.subcat] = (bySubcatMap[x.subcat] || 0) + x.amount; });
    const bySubcat = Object.entries(bySubcatMap).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value).slice(0, 6);
    const bestIncome = data.incomeLog.reduce((m, x) => Math.max(m, x.amount), 0);
    const maxSubcat = bySubcat.reduce((m, x) => Math.max(m, x.value), 0);

    const thisMonth = monthKey(Date.now());
    const incomeThisMonth = data.incomeLog.filter(x => monthKey(x.date) === thisMonth).reduce((s, x) => s + x.amount, 0);
    const expenseThisMonth = data.expenseLog.filter(x => monthKey(x.date) === thisMonth).reduce((s, x) => s + x.amount, 0);
    const netThisMonth = incomeThisMonth - expenseThisMonth;

    // Сколько от дохода в этом месяце ушло в каждый раздел (Необходимое/Желания/Накопления)
    const byCategoryThisMonth = { needs: 0, wants: 0, savings: 0 };
    data.incomeLog.filter(x => monthKey(x.date) === thisMonth).forEach(x => {
      byCategoryThisMonth.needs += x.needsAmt || 0;
      byCategoryThisMonth.wants += x.wantsAmt || 0;
      byCategoryThisMonth.savings += x.savingsAmt || 0;
    });

    // Сколько именно пришло в каждую цель в этом месяце
    const goalContribThisMonth = {};
    data.incomeLog.filter(x => monthKey(x.date) === thisMonth).forEach(x => {
      Object.entries(x.wantsAlloc || {}).forEach(([gid, v]) => { goalContribThisMonth[gid] = (goalContribThisMonth[gid] || 0) + (parseFloat(v) || 0); });
      Object.entries(x.savingsAlloc || {}).forEach(([gid, v]) => { goalContribThisMonth[gid] = (goalContribThisMonth[gid] || 0) + (parseFloat(v) || 0); });
    });
    // Траты по разделам за этот месяц (сколько потрачено именно из "Накоплений", если оттуда снимали)
    const expenseByCategoryThisMonth = { needs: 0, wants: 0, savings: 0 };
    data.expenseLog.filter(x => monthKey(x.date) === thisMonth).forEach(x => { expenseByCategoryThisMonth[x.category] += x.amount; });

    return {
      totalIncome, totalExpense, byCategory, bySubcat, bestIncome, maxSubcat,
      incomeThisMonth, expenseThisMonth, netThisMonth, byCategoryThisMonth, goalContribThisMonth, expenseByCategoryThisMonth,
    };
  }, [data.incomeLog, data.expenseLog]);

  if (!loaded) {
    return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>Загрузка…</div>;
  }

  return (
    <div style={{ display: 'flex', justifyContent: 'center' }}>
      <div style={{ width: '100%', maxWidth: 480, minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
        <div style={{ flex: 1, padding: '32px 20px 96px' }}>

          {pending ? (
            <AllocateView pending={pending} setPending={setPending} goals={data.goals} onConfirm={confirmAllocation} onCancel={() => setPending(null)} />
          ) : tab === 'dashboard' ? (
            <>

function AllocateView({ pending, setPending, goals, onConfirm, onCancel }) {
  const needsAmt = parseFloat(pending.needsAmt) || 0;
  const wantsAmt = parseFloat(pending.wantsAmt) || 0;
  const savingsAmt = parseFloat(pending.savingsAmt) || 0;
  const topSum = needsAmt + wantsAmt + savingsAmt;
  const topLeft = pending.amount - topSum;
  const topOver = Math.abs(topLeft) > 0.01;

  const wantsAllocated = Object.values(pending.wantsAlloc).reduce((s, v) => s + (parseFloat(v) || 0), 0);
  const savingsAllocated = Object.values(pending.savingsAlloc).reduce((s, v) => s + (parseFloat(v) || 0), 0);
  const wantsLeft = wantsAmt - wantsAllocated;
  const savingsLeft = savingsAmt - savingsAllocated;
  const over = topOver || wantsLeft < -0.01 || savingsLeft < -0.01;

  function update(section, id, val) { setPending(p => ({ ...p, [section]: { ...p[section], [id]: val } })); }
  function updateTop(cat, val) { setPending(p => ({ ...p, [`${cat}Amt`]: val })); }
  function fillRestInto(cat) {
    const others = CATS.filter(c => c !== cat).reduce((s, c) => s + (parseFloat(pending[`${c}Amt`]) || 0), 0);
    setPending(p => ({ ...p, [`${cat}Amt`]: Math.max(0, Math.round((pending.amount - others) * 100) / 100) }));
  }

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button onClick={onCancel} style={{ padding: 8, borderRadius: 999, background: '#fff', color: '#1B2B22', display: 'flex' }}><IconBack /></button>
        <h1 className="ff-display" style={{ fontSize: 20, fontWeight: 600, margin: 0 }}>Распредели {fmt(pending.amount)}</h1>
      </div>

      <div style={{ fontSize: 13, marginBottom: 12, color: '#6B7268' }}>
        Куда пойдут деньги — впиши суммы сам (по умолчанию подставлены проценты из настроек, можно поменять как угодно).
      </div>

      {CATS.map(cat => (
        <div key={cat} style={{ borderRadius: 16, padding: 14, marginBottom: 10, background: META[cat].soft }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10 }}>
            <span style={{ fontWeight: 500, color: META[cat].color }}>{META[cat].label}</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <input type="number" inputMode="decimal" style={{ width: 100, textAlign: 'right', borderRadius: 8, padding: '6px 8px', fontSize: 14, border: '1px solid #DDD8C8', background: '#fff' }}
                value={pending[`${cat}Amt`]} onChange={e => updateTop(cat, e.target.value)} />
              <button onClick={() => fillRestInto(cat)} style={{ fontSize: 11, padding: '6px 8px', borderRadius: 8, background: '#fff', color: META[cat].color }}>Остаток сюда</button>
            </div>
          </div>
        </div>
      ))}
      <div style={{ fontSize: 12, marginBottom: 20, color: topOver ? '#B5502F' : '#6B7268' }}>
        {topOver ? (topLeft > 0 ? `Не распределено ещё: ${fmt(topLeft)}` : `Распределено больше, чем пришло, на ${fmt(-topLeft)}`) : 'Вся сумма распределена ✓'}
      </div>

      {['wants', 'savings'].map(section => (
        <div key={section} style={{ marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <span style={{ fontWeight: 500, color: META[section].color }}>{META[section].label} · цели</span>
            <span style={{ fontWeight: 600 }}>{fmt(section === 'wants' ? wantsAmt : savingsAmt)}</span>
          </div>
          {goals[section].length === 0 ? (
            <div style={{ borderRadius: 12, padding: 12, fontSize: 14, background: '#fff', color: '#6B7268' }}>
              Нет целей — вся сумма попадёт в свободные {META[section].label.toLowerCase()}.
            </div>
          ) : goals[section].map(g => (
            <div key={g.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderRadius: 12, padding: '8px 12px', marginBottom: 8, background: '#fff' }}>
              <span style={{ fontSize: 14, flex: 1 }}>{g.name}</span>
              <input type="number" inputMode="decimal" placeholder="0" style={{ width: 96, textAlign: 'right', borderRadius: 8, padding: '6px 8px', fontSize: 14, border: '1px solid #DDD8C8' }}
                value={pending[`${section}Alloc`][g.id] || ''} onChange={e => update(`${section}Alloc`, g.id, e.target.value)} />
            </div>
          ))}
          <div style={{ fontSize: 12, marginTop: 8, color: (section === 'wants' ? wantsLeft : savingsLeft) < -0.01 ? '#B5502F' : '#6B7268' }}>
            {(section === 'wants' ? wantsLeft : savingsLeft) < -0.01 ? 'Распределено больше, чем есть — уменьши суммы' : `Останется в свободных: ${fmt(section === 'wants' ? wantsLeft : savingsLeft)}`}
          </div>
        </div>
      ))}
      <button onClick={onConfirm} disabled={over} className="btn-ios" style={{ width: '100%', padding: 14, color: '#fff', background: over ? '#B3ADA0' : '#1B2B22', marginTop: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}><IconCheck /> Подтвердить</button>
    </div>
  );
}

function SettingsModal({ percents, onSave, onClose, onReset, displayCurrency, onCurrencyChange, rates, ratesError }) {
  const [p, setP] = useState(percents);
  const [confirmingReset, setConfirmingReset] = useState(false);
  const sum = p.needs + p.wants + p.savings;
  return (
    <div style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'flex-end', justifyContent: 'center', background: 'rgba(27,43,34,0.4)' }}>
      <div style={{ width: '100%', maxWidth: 480, borderRadius: '24px 24px 0 0', padding: 24, background: '#fff', maxHeight: '85vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <h2 className="ff-display" style={{ fontSize: 18, fontWeight: 600, margin: 0 }}>Настройки</h2>
          <button onClick={onClose} style={{ background: 'none', color: '#6B7268', display: 'flex' }}><IconClose /></button>
        </div>

        <Field label="Валюта отображения">
          <select style={inputStyle} value={displayCurrency} onChange={e => onCurrencyChange(e.target.value)}>
            {CURRENCIES.map(c => <option key={c.code} value={c.code}>{c.label}</option>)}
          </select>
        </Field>
        <div style={{ fontSize: 12, marginBottom: 20, color: ratesError ? '#B5502F' : '#6B7268' }}>
          {ratesError ? 'Курс сейчас недоступен — показываю по последнему сохранённому' : rates ? 'Курс обновляется автоматически' : 'Загружаю курс…'}
        </div>

        <h3 style={{ fontSize: 14, fontWeight: 500, marginBottom: 12, color: '#6B7268' }}>Проценты распределения</h3>
        {CATS.map(c => (
          <Field key={c} label={META[c].label}>
            <input type="number" style={inputStyle} value={p[c]} onChange={e => setP({ ...p, [c]: parseInt(e.target.value) || 0 })} />
          </Field>
        ))}
        <div style={{ fontSize: 12, marginBottom: 16, color: sum === 100 ? '#6B7268' : '#B5502F' }}>Сумма: {sum}% {sum !== 100 && '— должно быть ровно 100%'}</div>
        <button onClick={() => { if (onSave(p)) onClose(); }} disabled={sum !== 100} style={{ width: '100%', padding: 12, borderRadius: 12, fontWeight: 500, color: '#fff', background: sum === 100 ? '#3E5C76' : '#B3ADA0', marginBottom: 12 }}>Сохранить</button>
        <div style={{ paddingTop: 12, borderTop: '1px solid #E7E4D8' }}>
          {!confirmingReset ? (
            <button onClick={() => setConfirmingReset(true)} style={{ width: '100%', padding: 12, borderRadius: 12, fontWeight: 500, color: '#B5502F', background: '#F3E2DA', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}><IconTrash /> Стереть все данные</button>
          ) : (
            <div>
              <div style={{ fontSize: 14, marginBottom: 12, color: '#6B7268' }}>Это удалит все доходы, траты и цели без возможности вернуть. Точно?</div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => setConfirmingReset(false)} style={{ flex: 1, padding: 12, borderRadius: 12, fontWeight: 500, background: '#F0EEE4', color: '#6B7268' }}>Отмена</button>
                <button onClick={() => { onReset(); setConfirmingReset(false); onClose(); }} style={{ flex: 1, padding: 12, borderRadius: 12, fontWeight: 500, color: '#fff', background: '#B5502F' }}>Да, стереть</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function GoalModal({ category, onAdd, onClose }) {
  const [name, setName] = useState('');
  const [target, setTarget] = useState('');
  return (
    <div style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'flex-end', justifyContent: 'center', background: 'rgba(27,43,34,0.4)' }}>
      <div style={{ width: '100%', maxWidth: 480, borderRadius: '24px 24px 0 0', padding: 24, background: '#fff' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <h2 className="ff-display" style={{ fontSize: 18, fontWeight: 600, margin: 0 }}>Новая цель · {META[category].label}</h2>
          <button onClick={onClose} style={{ background: 'none', color: '#6B7268', display: 'flex' }}><IconClose /></button>
        </div>
        <Field label="Название">
          <input style={inputStyle} value={name} onChange={e => setName(e.target.value)} placeholder={category === 'wants' ? 'Поездка в Грузию' : 'Погашение долга'} />
        </Field>
        <Field label="Целевая сумма">
          <input type="number" style={inputStyle} value={target} onChange={e => setTarget(e.target.value)} placeholder="0" />
        </Field>
        <button onClick={() => onAdd(category, name, target)} style={{ width: '100%', padding: 12, borderRadius: 12, fontWeight: 500, color: '#fff', background: META[category].color }}>Добавить цель</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
